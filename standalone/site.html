<style>/* K2V ENTERPRISE — public site
   Direction: industrial supply vernacular. Graphite + safety amber, condensed
   display type, mono for part numbers. Signature: the hazard strip and the
   spec-plate card. Everything else stays quiet. */

:root {
  --ink: #0F151C;
  --steel: #1B2733;
  --slate: #5C6874;
  --line: #DBDFD9;
  --paper: #F4F5F2;
  --white: #FFFFFF;
  --amber: #F2A413;
  --amber-deep: #B77C06;
  --signal: #C8352B;

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --wrap: 1180px;
  --gap: clamp(48px, 7vw, 96px);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

body {
  margin: 0;
  font-family: var(--body);
  font-size: 16.5px;
  line-height: 1.62;
  color: var(--steel);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }
a { color: inherit; }

h1, h2, h3, h4 {
  font-family: var(--display);
  color: var(--ink);
  letter-spacing: -0.022em;
  line-height: 1.05;
  margin: 0 0 .5em;
  font-weight: 800;
}
h1 { font-size: clamp(2.4rem, 5.6vw, 4.1rem); }
h2 { font-size: clamp(1.75rem, 3.4vw, 2.6rem); }
h3 { font-size: 1.2rem; letter-spacing: -0.01em; }
p { margin: 0 0 1em; }

.wrap { width: min(100% - 40px, var(--wrap)); margin-inline: auto; }
.section { padding: var(--gap) 0; }
.section--tight { padding: calc(var(--gap) * .62) 0; }

.eyebrow {
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--amber-deep);
  margin: 0 0 14px;
}
.lede { font-size: 1.06rem; color: var(--slate); max-width: 60ch; }

/* --- signature: hazard strip --- */
.hazard {
  height: 7px;
  background: repeating-linear-gradient(-45deg, var(--amber) 0 12px, var(--ink) 12px 24px);
}

/* --- buttons --- */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase;
  padding: 15px 24px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--white);
  text-decoration: none; cursor: pointer; transition: background .15s, color .15s, transform .15s;
}
.btn:hover { background: var(--amber); border-color: var(--amber); color: var(--ink); }
.btn--ghost { background: transparent; color: var(--ink); }
.btn--ghost:hover { background: var(--ink); border-color: var(--ink); color: var(--white); }
.btn--light { background: var(--amber); border-color: var(--amber); color: var(--ink); }
.btn--light:hover { background: var(--white); border-color: var(--white); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* --- header --- */
.utility {
  background: var(--ink); color: #9DA9B4;
  font-family: var(--mono); font-size: .72rem; letter-spacing: .06em;
}
.utility .wrap { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; flex-wrap: wrap; }
.utility a { color: #C6CFD7; text-decoration: none; }
.utility a:hover { color: var(--amber); }
.utility span + span { margin-left: 18px; }

.masthead { background: var(--white); position: sticky; top: 0; z-index: 40; }
.masthead .wrap { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 0; }
.brand { display: flex; align-items: center; gap: 13px; text-decoration: none; }
.brand__mark {
  width: 46px; height: 46px; display: grid; place-items: center;
  background: var(--ink); color: var(--amber);
  font-family: var(--display); font-weight: 800; font-size: 1rem; letter-spacing: -.03em;
}
.brand__name { font-family: var(--display); font-weight: 800; font-size: 1.16rem; letter-spacing: -.02em; color: var(--ink); line-height: 1.1; }
.brand__sub { font-family: var(--mono); font-size: .64rem; letter-spacing: .13em; text-transform: uppercase; color: var(--slate); }

.nav { display: flex; align-items: center; gap: 6px; }
.nav a {
  font-family: var(--mono); font-size: .76rem; letter-spacing: .1em; text-transform: uppercase;
  text-decoration: none; color: var(--steel); padding: 10px 13px; border-bottom: 2px solid transparent;
}
.nav a:hover { color: var(--ink); border-bottom-color: var(--amber); }
.nav a.is-active { color: var(--ink); border-bottom-color: var(--ink); }
.nav__cta { margin-left: 10px; }

.burger { display: none; background: none; border: 1.5px solid var(--line); padding: 11px 13px; cursor: pointer; font-family: var(--mono); font-size: .72rem; letter-spacing: .1em; }

@media (max-width: 900px) {
  .burger { display: block; }
  .nav {
    position: absolute; top: 100%; left: 0; right: 0; background: var(--white);
    flex-direction: column; align-items: stretch; padding: 8px 20px 20px;
    border-bottom: 1px solid var(--line); display: none;
  }
  .nav.is-open { display: flex; }
  .nav a { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .nav__cta { margin: 12px 0 0; justify-content: center; }
}

/* --- hero --- */
.hero { background: var(--ink); color: #DDE3E9; padding: clamp(56px, 8vw, 96px) 0; }
.hero h1 { color: var(--white); max-width: 15ch; }
.hero__grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(32px, 5vw, 72px); align-items: start; }
.hero__body { color: #A9B5C0; font-size: 1.08rem; max-width: 52ch; }
.hero__actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
.hero .btn--ghost { color: var(--white); border-color: #3B4A59; }
.hero .btn--ghost:hover { background: var(--white); color: var(--ink); border-color: var(--white); }

/* the supply index doubles as navigation — the hero's thesis is the catalogue */
.index-card { background: #151D26; border: 1px solid #26323E; }
.index-card__head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 16px 20px; border-bottom: 1px solid #26323E;
  font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: #7E8C99;
}
.index-row {
  display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 14px;
  padding: 12px 20px; text-decoration: none; border-bottom: 1px solid #1F2A35; color: #C8D2DB;
  transition: background .14s, color .14s;
}
.index-row:last-child { border-bottom: 0; }
.index-row:hover { background: #1D2731; color: var(--white); }
.index-row:hover .index-row__code { color: var(--amber); }
.index-row__code { font-family: var(--mono); font-size: .74rem; color: #6C7A87; letter-spacing: .05em; }
.index-row__name { font-size: .95rem; }
.index-row__n { font-family: var(--mono); font-size: .74rem; color: #6C7A87; }

@media (max-width: 860px) { .hero__grid { grid-template-columns: 1fr; } }

/* --- stats --- */
.stats { background: var(--steel); }
.stats .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
.stat { padding: 26px 20px; border-left: 1px solid #2C3A48; }
.stat:first-child { border-left: 0; padding-left: 0; }
.stat__v { font-family: var(--display); font-weight: 800; font-size: 2rem; color: var(--amber); line-height: 1; }
.stat__l { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: #93A0AC; margin-top: 8px; }
@media (max-width: 720px) {
  .stats .wrap { grid-template-columns: repeat(2, 1fr); }
  .stat { border-left: 0; padding-left: 0; }
}

/* --- generic grids --- */
.grid { display: grid; gap: 24px; }
.grid--2 { grid-template-columns: repeat(2, 1fr); }
.grid--3 { grid-template-columns: repeat(3, 1fr); }
.grid--4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 940px) { .grid--3, .grid--4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .grid--2, .grid--3, .grid--4 { grid-template-columns: 1fr; } }

.section__head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 34px; flex-wrap: wrap; }
.section__head p { margin: 0; }

/* --- why cards --- */
.why { background: var(--white); border: 1px solid var(--line); padding: 26px 24px 28px; border-top: 3px solid var(--ink); }
.why h3 { margin-bottom: .4em; }
.why p { margin: 0; color: var(--slate); font-size: .95rem; }

/* --- category tile --- */
.tile { background: var(--white); border: 1px solid var(--line); text-decoration: none; display: block; transition: border-color .15s, transform .15s; }
.tile:hover { border-color: var(--ink); transform: translateY(-2px); }
.tile img { aspect-ratio: 4 / 3; object-fit: cover; width: 100%; }
.tile__body { padding: 18px 20px 20px; }
.tile__code { font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; color: var(--amber-deep); }
.tile h3 { margin: 6px 0 6px; }
.tile p { margin: 0; font-size: .9rem; color: var(--slate); }
.tile__n { font-family: var(--mono); font-size: .72rem; color: var(--slate); margin-top: 12px; display: block; }

/* --- spec plate: the product card --- */
.plate { background: var(--white); border: 1px solid var(--line); display: flex; flex-direction: column; text-decoration: none; transition: border-color .15s; }
.plate:hover { border-color: var(--ink); }
.plate img { aspect-ratio: 4 / 3; object-fit: cover; width: 100%; }
.plate__body { padding: 16px 18px 20px; display: flex; flex-direction: column; flex: 1; }
.plate__sku {
  font-family: var(--mono); font-size: .7rem; letter-spacing: .06em; color: var(--white);
  background: var(--ink); padding: 3px 8px; align-self: flex-start; margin-bottom: 10px;
}
.plate h3 { font-size: 1.02rem; margin-bottom: .35em; }
.plate p { font-size: .88rem; color: var(--slate); margin: 0 0 14px; }
.plate__more { margin-top: auto; font-family: var(--mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-deep); }

/* --- product detail --- */
.detail { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 60px); align-items: start; }
@media (max-width: 860px) { .detail { grid-template-columns: 1fr; } }
.spec-table { width: 100%; border-collapse: collapse; margin: 22px 0 26px; }
.spec-table th, .spec-table td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: .92rem; }
.spec-table th { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--slate); width: 42%; font-weight: 400; }
.spec-table tr:first-child th, .spec-table tr:first-child td { border-top: 1px solid var(--line); }

.crumbs { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--slate); margin-bottom: 20px; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--ink); }

.tag { font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); padding: 4px 9px; color: var(--slate); margin-right: 6px; display: inline-block; }

/* --- filters --- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 30px; }
.filters button {
  font-family: var(--mono); font-size: .73rem; letter-spacing: .08em; text-transform: uppercase;
  background: var(--white); border: 1px solid var(--line); padding: 9px 14px; cursor: pointer; color: var(--steel);
}
.filters button:hover { border-color: var(--ink); }
.filters button.is-active { background: var(--ink); color: var(--white); border-color: var(--ink); }

/* --- prose --- */
.prose { max-width: 68ch; }
.prose h3 { margin-top: 1.8em; }
.prose ul { padding-left: 20px; }
.prose li { margin-bottom: .5em; }

/* --- news --- */
.post { background: var(--white); border: 1px solid var(--line); text-decoration: none; display: block; }
.post:hover { border-color: var(--ink); }
.post img { aspect-ratio: 16 / 9; object-fit: cover; width: 100%; }
.post__body { padding: 18px 20px 22px; }
.post__date { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; color: var(--amber-deep); }
.post h3 { margin: 8px 0 8px; }
.post p { margin: 0; font-size: .9rem; color: var(--slate); }

/* --- forms --- */
.form { display: grid; gap: 16px; max-width: 560px; }
.field label { display: block; font-family: var(--mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); margin-bottom: 7px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); background: var(--white);
  font-family: var(--body); font-size: .96rem; color: var(--ink);
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink); outline: none; }
.field textarea { min-height: 140px; resize: vertical; }
.notice { background: #EAF4EC; border-left: 4px solid #2F7D4E; padding: 14px 16px; font-size: .92rem; }

/* --- CTA band --- */
.band { background: var(--amber); color: var(--ink); }
.band .wrap { display: flex; justify-content: space-between; align-items: center; gap: 28px; padding: 46px 0; flex-wrap: wrap; }
.band h2 { margin: 0 0 .3em; }
.band p { margin: 0; max-width: 48ch; }

/* --- footer --- */
.footer { background: var(--ink); color: #97A3AE; padding: 56px 0 0; font-size: .92rem; }
.footer h4 { font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--white); margin: 0 0 16px; font-weight: 500; }
.footer a { color: #B6C1CB; text-decoration: none; }
.footer a:hover { color: var(--amber); }
.footer__grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 36px; padding-bottom: 44px; }
@media (max-width: 860px) { .footer__grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .footer__grid { grid-template-columns: 1fr; } }
.footer ul { list-style: none; padding: 0; margin: 0; }
.footer li { margin-bottom: 9px; }
.footer__bar { border-top: 1px solid #24303B; padding: 20px 0; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: var(--mono); font-size: .7rem; letter-spacing: .06em; color: #6E7B87; }

/* --- floating contact rail (mirrors the inspiration site's behaviour) --- */
.rail { position: fixed; right: 0; bottom: 90px; z-index: 50; display: grid; }
.rail a {
  width: 52px; height: 52px; display: grid; place-items: center; background: var(--ink); color: var(--white);
  text-decoration: none; border-bottom: 1px solid #2A3742; font-family: var(--mono); font-size: .62rem; letter-spacing: .06em;
}
.rail a:hover { background: var(--amber); color: var(--ink); }
@media (max-width: 620px) { .rail { bottom: 0; display: flex; width: 100%; } .rail a { flex: 1; height: 48px; border-bottom: 0; border-left: 1px solid #2A3742; } }

/* --- mock ribbon --- */
.mockbar {
  background: var(--signal); color: #fff; font-family: var(--mono); font-size: .68rem;
  letter-spacing: .1em; text-transform: uppercase; text-align: center; padding: 6px 12px;
}
.mockbar a { color: #fff; }

.empty { border: 1px dashed var(--line); padding: 40px; text-align: center; color: var(--slate); font-family: var(--mono); font-size: .8rem; letter-spacing: .06em; }
</style>

   Persists to localStorage. Falls back to memory if storage is blocked
   (private mode, sandboxed preview) so nothing hard-fails.
   Swap this file for real API calls when moving to Wagtail CRX. */
(function (global) {
  "use strict";

  var KEY = "k2v_cms_content";
  var SESSION_KEY = "k2v_cms_session";
  var mem = {};

  var safe = {
    get: function (k) { try { return global.localStorage.getItem(k); } catch (e) { return k in mem ? mem[k] : null; } },
    set: function (k, v) { try { global.localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
    del: function (k) { try { global.localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
  };

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function uid(prefix) {
    return (prefix || "id") + "-" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
  }

  function slugify(s) {
    return String(s || "").toLowerCase().trim()
      .replace(/['"]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "").slice(0, 60) || uid("page");
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* Deterministic SVG placeholder so the mock never shows a broken image.
     Admin can paste a real image URL on any record to override it. */
  function placeholder(label, code) {
    var hues = ["#F2A413", "#2E7D8F", "#C8352B", "#5B6C4F", "#7A5C9E", "#B36A2E"];
    var seed = 0, s = String(label || "K2V");
    for (var i = 0; i < s.length; i++) seed = (seed * 31 + s.charCodeAt(i)) % 997;
    var accent = hues[seed % hues.length];
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360">' +
      '<rect width="480" height="360" fill="#151C24"/>' +
      '<g opacity="0.14">' +
      '<path d="M-120 360 L120 0 M-40 360 L200 0 M40 360 L280 0 M120 360 L360 0 M200 360 L440 0 M280 360 L520 0 M360 360 L600 0" stroke="' + accent + '" stroke-width="26"/>' +
      '</g>' +
      '<rect x="24" y="24" width="432" height="312" fill="none" stroke="' + accent + '" stroke-opacity="0.45" stroke-width="2"/>' +
      '<text x="44" y="70" font-family="ui-monospace,Menlo,monospace" font-size="17" letter-spacing="2" fill="' + accent + '">' + esc(code || "K2V") + '</text>' +
      '<text x="44" y="315" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="26" fill="#F4F5F2">' + esc((label || "").slice(0, 26)) + '</text>' +
      '</svg>';
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  var Store = {
    uid: uid, slugify: slugify, esc: esc, clone: clone, placeholder: placeholder,

    load: function () {
      var raw = safe.get(KEY);
      if (raw) {
        try {
          var d = JSON.parse(raw);
          if (d && d.version === global.K2V_SEED.version) return d;
        } catch (e) { /* corrupt payload — fall through to seed */ }
      }
      return clone(global.K2V_SEED);
    },

    save: function (data) {
      data.updatedAt = new Date().toISOString();
      safe.set(KEY, JSON.stringify(data));
      return data;
    },

    reset: function () { safe.del(KEY); return clone(global.K2V_SEED); },

    isDirty: function () { return !!safe.get(KEY); },

    /* Session is mock only — see README. Never use this pattern for real auth. */
    login: function (user, pass) {
      if (user === "admin" && pass === "k2v2026") {
        safe.set(SESSION_KEY, JSON.stringify({ user: user, at: Date.now() }));
        return true;
      }
      return false;
    },
    logout: function () { safe.del(SESSION_KEY); },
    session: function () {
      try { return JSON.parse(safe.get(SESSION_KEY) || "null"); } catch (e) { return null; }
    },

    /* --- read helpers shared by site and admin --- */
    categoryOf: function (data, product) {
      return data.categories.filter(function (c) { return c.id === product.categoryId; })[0] || null;
    },
    productsIn: function (data, categoryId) {
      return data.products.filter(function (p) { return p.published && p.categoryId === categoryId; });
    },
    imageFor: function (rec, code) {
      return rec && rec.image ? rec.image : placeholder(rec ? (rec.name || rec.title) : "K2V", code);
    }
  };

  global.K2VStore = Store;
})(window);
</script><script>/* K2V ENTERPRISE — public site renderer.

(function () {
  "use strict";

  var S = window.K2VStore;

  }
  function productBySku(sku) {

  function fmtDate(d) {
    if (!d) return "";

    q("#footer-grid").innerHTML =

      esc(s.address) + "<br><span style=\"font-size:.8rem;opacity:.7\">" + esc(s.addressNote || "") + "</span></p></div>" +
      "<div><h4>Products</h4><ul>" + pubCats().slice(0, 6).map(function (c) {

      "<div><h4>Contact</h4><ul>" +

  /* ---------- partials ---------- */

  }

  function tile(c) {
    var n = S.productsIn(data, c.id).length;

    return '<section class="band"><div class="wrap"><div><h2>' + esc(h.ctaTitle) + "</h2><p>" + esc(h.ctaBody) + "</p></div>" +
      '<a class="btn" href="#/contact">Start an enquiry</a></div></section>';

  /* ---------- routes ---------- */

  function home() {
    var h = data.home;
    var cats = pubCats();
    var featured = (h.featuredSkus || []).map(productBySku).filter(function (p) { return p && p.published; });
    if (!featured.length) featured = pubProducts().slice(0, 4);

    return '<section class="hero"><div class="wrap hero__grid"><div>' +
      '<p class="eyebrow">' + esc(h.heroEyebrow) + "</p><h1>" + esc(h.heroTitle) + "</h1>" +

      cats.map(function (c) {
        return '<a class="index-row" href="#/products/' + esc(c.slug) + '">' +
          '<span class="index-row__code">' + esc(c.code) + "</span>" +
          '<span class="index-row__name">' + esc(c.name) + "</span>" +
          '<span class="index-row__n">' + S.productsIn(data, c.id).length + "</span></a>";

      '<section class="stats"><div class="wrap">' + (h.stats || []).map(function (s) {

      }).join("") + "</div></section>" +

      '<section class="section"><div class="wrap"><div class="section__head"><div>' +
      '<p class="eyebrow">Why K2V</p><h2>' + esc(h.whyTitle) + "</h2></div>" +
      '<p class="lede">' + esc(h.whyBody) + "</p></div>" +

  function products(catSlug) {
    var cats = pubCats();
    var active = catSlug ? catBySlug(catSlug) : null;
    var list = pubProducts().filter(function (p) { return !active || p.categoryId === active.id; });

    return '<section class="section"><div class="wrap">' +
      '<p class="eyebrow">Catalogue</p><h1>' + esc(active ? active.name : "All products") + "</h1>" +
      '<p class="lede">' + esc(active ? active.blurb : "Every line K2V Enterprise supplies. Filter by category, then send the list you need priced.") + "</p>" +
      '<div class="filters" style="margin-top:30px">' +
      '<button data-cat="" class="' + (active ? "" : "is-active") + '">All (' + pubProducts().length + ")</button>" +
      cats.map(function (c) {
        return '<button data-cat="' + esc(c.slug) + '" class="' + (active && active.id === c.id ? "is-active" : "") + '">' +
          esc(c.name) + " (" + S.productsIn(data, c.id).length + ")</button>";
      }).join("") + "</div>" +
      (list.length ? '<div class="grid grid--4">' + list.map(plate).join("") + "</div>"
        : '<div class="empty">No published items in this category yet. Add one in /admin.</div>') +
      "</div></section>" + band();
  }

  function productDetail(sku) {
    var p = productBySku(sku);
    if (!p || !p.published) return notFound();
    var c = S.categoryOf(data, p);
    var related = pubProducts().filter(function (x) { return x.categoryId === p.categoryId && x.sku !== p.sku; }).slice(0, 4);

    return '<section class="section"><div class="wrap">' +
      '<p class="crumbs"><a href="#/products">Products</a> / ' +
      (c ? '<a href="#/products/' + esc(c.slug) + '">' + esc(c.name) + "</a> / " : "") + esc(p.sku) + "</p>" +
      '<div class="detail"><div><img src="' + img(p, p.sku) + '" alt="' + esc(p.name) + '" style="border:1px solid var(--line)"></div>' +
      "<div><h1 style=\"font-size:clamp(1.9rem,3.6vw,2.7rem)\">" + esc(p.name) + "</h1>" +
      '<p style="font-family:var(--mono);font-size:.8rem;letter-spacing:.06em;color:var(--amber-deep)">' + esc(p.sku) + "</p>" +
      '<p class="lede">' + esc(p.summary) + "</p>" +
      "<table class=\"spec-table\">" + (p.specs || []).map(function (row) {
        return "<tr><th>" + esc(row[0]) + "</th><td>" + esc(row[1]) + "</td></tr>";
      }).join("") + "</table>" +
      "<p>" + esc(p.description) + "</p>" +
      "<p>" + (p.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</p>" +
      '<p style="margin-top:24px"><a class="btn" href="#/contact?sku=' + encodeURIComponent(p.sku) + '">Request a quote</a></p>' +
      "</div></div>" +
      (related.length ? '<div style="margin-top:70px"><h2 style="font-size:1.5rem">More in ' + esc(c ? c.name : "this range") + '</h2><div class="grid grid--4" style="margin-top:24px">' + related.map(plate).join("") + "</div></div>" : "") +
      "</div></section>" + band();
  }

  function newsIndex() {
    var list = pubNews();
    return '<section class="section"><div class="wrap"><p class="eyebrow">Updates</p><h1>News</h1>' +
      '<p class="lede">Stock arrivals, range changes and delivery notices.</p>' +
      '<div class="grid grid--3" style="margin-top:36px">' +
      (list.length ? list.map(postCard).join("") : '<div class="empty">No posts published yet.</div>') +
      "</div></div></section>" + band();
  }

  function newsDetail(slug) {
    var n = pubNews().filter(function (x) { return x.slug === slug; })[0];
    if (!n) return notFound();
    return '<section class="section"><div class="wrap">' +
      '<p class="crumbs"><a href="#/news">News</a> / ' + esc(fmtDate(n.date)) + "</p>" +
      "<h1>" + esc(n.title) + "</h1>" +
      '<img src="' + img(n, "NEWS") + '" alt="" style="border:1px solid var(--line);margin:26px 0 32px;max-height:420px;object-fit:cover;width:100%">' +
      '<div class="prose">' + n.body + "</div></div></section>" + band();
  }

  function pageDetail(slug) {
    var p = pageBySlug(slug);
    if (!p) return notFound();
    return '<section class="section"><div class="wrap"><p class="eyebrow">' + esc(data.site.name) + "</p>" +
      "<h1>" + esc(p.title) + '</h1><p class="lede">' + esc(p.intro) + "</p>" +
      '<div class="prose" style="margin-top:36px">' + p.body + "</div></div></section>" + band();
  }

  function contact(sku) {
    var s = data.site;
    return '<section class="section"><div class="wrap"><div class="grid grid--2" style="gap:clamp(32px,6vw,72px)">' +
      '<div><p class="eyebrow">Enquiries</p><h1>Send us the list.</h1>' +
      '<p class="lede">Part numbers, a photo of the packaging you are replacing, or a rough description. We come back with pricing, pack size and lead time.</p>' +
      '<table class="spec-table" style="margin-top:30px">' +
      "<tr><th>Email</th><td><a href=\"mailto:" + esc(s.email) + "\">" + esc(s.email) + "</a></td></tr>" +
      "<tr><th>Phone</th><td><a href=\"tel:" + esc((s.phone || "").replace(/\s/g, "")) + "\">" + esc(s.phone) + "</a></td></tr>" +
      "<tr><th>WhatsApp</th><td><a href=\"https://wa.me/" + esc(s.whatsapp) + "\" target=\"_blank\" rel=\"noopener\">+" + esc(s.whatsapp) + "</a></td></tr>" +
      "<tr><th>Location</th><td>" + esc(s.address) + "</td></tr>" +
      "<tr><th>Hours</th><td>" + esc(s.hours) + "</td></tr></table></div>" +
      '<div><form class="form" id="enquiry">' +
      field("Name", '<input name="name" required autocomplete="name">') +
      field("Company", '<input name="company" autocomplete="organization">') +
      field("Email", '<input name="email" type="email" required autocomplete="email">') +
      field("Phone", '<input name="phone" autocomplete="tel">') +
      field("Item of interest", '<input name="sku" value="' + esc(sku || "") + '" placeholder="e.g. K2V-SF-500">') +
      field("What do you need?", "<textarea name=\"message\" required placeholder=\"Quantities, sizes, delivery location…\"></textarea>") +
      '<div><button class="btn" type="submit">Send enquiry</button></div>' +
      '<p style="font-size:.8rem;color:var(--slate);margin:0">Mock form. Submissions are stored in this browser and appear in the admin inbox.</p>' +
      "</form><div id=\"enquiry-ok\"></div></div></div></div></section>";
  }

  function field(label, input) {
    return '<div class="field"><label>' + esc(label) + "</label>" + input + "</div>";
  }

  function notFound() {
    return '<section class="section"><div class="wrap"><p class="eyebrow">404</p><h1>Page not found</h1>' +
      '<p class="lede">That address does not match anything published.</p>' +
      '<p style="margin-top:24px"><a class="btn" href="#/">Back to home</a></p></div></section>';
  }

  /* ---------- router ---------- */

  function route() {
    var raw = (location.hash || "#/").slice(1);
    var qs = "";
    var qi = raw.indexOf("?");
    if (qi > -1) { qs = raw.slice(qi + 1); raw = raw.slice(0, qi); }
    var parts = raw.split("/").filter(Boolean);
    var html;

    if (!parts.length) html = home();
    else if (parts[0] === "products") html = products(parts[1]);
    else if (parts[0] === "product") html = productDetail(decodeURIComponent(parts[1] || ""));
    else if (parts[0] === "news") html = parts[1] ? newsDetail(parts[1]) : newsIndex();
    else if (parts[0] === "page") html = pageDetail(parts[1]);
    else if (parts[0] === "contact") html = contact(param(qs, "sku"));
    else html = notFound();

    view.innerHTML = html;
    renderChrome();
    window.scrollTo({ top: 0, behavior: "auto" });
    bind();
  }

  function param(qs, key) {
    var out = "";
    qs.split("&").forEach(function (pair) {
      var kv = pair.split("=");
      if (decodeURIComponent(kv[0] || "") === key) out = decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
    });
    return out;
  }

  function bind() {
    view.querySelectorAll(".filters button").forEach(function (b) {
      b.addEventListener("click", function () {
        var c = b.getAttribute("data-cat");
        location.hash = c ? "#/products/" + c : "#/products";
      });
    });

    var form = document.getElementById("enquiry");
    if (form) {
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var fd = new FormData(form);
        var rec = { id: S.uid("enq"), at: new Date().toISOString(), status: "new" };
        fd.forEach(function (v, k) { rec[k] = String(v).slice(0, 2000); });
        data.enquiries.unshift(rec);
        S.save(data);
        form.style.display = "none";
        document.getElementById("enquiry-ok").innerHTML =
          '<div class="notice"><strong>Enquiry sent.</strong> We reply within one working day. ' +
          "It is now waiting in the admin inbox.</div>";
      });
    }
  }

  document.getElementById("burger").addEventListener("click", function () {
    var nav = document.getElementById("nav");
    var open = nav.classList.toggle("is-open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });

  window.addEventListener("hashchange", function () {
    document.getElementById("nav").classList.remove("is-open");
    route();
  });

  /* pick up edits made in the admin tab without a refresh */
  window.addEventListener("storage", function (e) {
    if (e.key === "k2v_cms_content") { data = S.load(); route(); }
  });

  route();
})();
</script>
</body>
</html>
